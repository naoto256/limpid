[package]
name = "limpid-prometheus"
version = "0.7.15"
edition = "2024"
description = "Prometheus exporter for limpid — converts control socket JSON to Prometheus text format"
license.workspace = true

[[bin]]
name = "limpid-prometheus"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Explicit feature list instead of "full": the exporter only needs the
# multi-thread runtime + macros (tokio::main / spawn), sockets (net),
# buffered async I/O (io-util), timeouts (time), and the Semaphore
# connection cap (sync). Keeping the set minimal both trims the build
# and documents what the binary actually exercises.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "net", "io-util", "time"] }
tempfile = "3"

[package.metadata.deb]
maintainer = "Naoto Morishima"
copyright = "2026, Naoto Morishima"
extended-description = "Prometheus exporter for limpid. Converts control socket JSON stats to Prometheus text exposition format."
section = "admin"
priority = "optional"
depends = "limpid"
assets = [
    ["target/release/limpid-prometheus", "usr/bin/", "755"],
    ["../../packaging/limpid-prometheus.default", "etc/default/limpid-prometheus", "644"],
]
# start = false mirrors limpid.service. Without it, cargo-deb's
# dh_installsystemd port defaults `start` to true and would start the
# exporter on install — and since limpid-prometheus.service declares
# `Requires=limpid.service`, that would pull limpid.service up too,
# defeating the deliberate `start = false` on the daemon (which exists
# so a `#DEBHELPER#` start can't collide with rsyslog/syslog-ng still
# holding the syslog ports on upgrade). enable = true (the default,
# stated for parity with limpid) leaves the exporter to start with the
# daemon on the next boot / explicit `systemctl start`.
systemd-units = { unit-name = "limpid-prometheus", unit-scripts = "../../packaging", enable = true, start = false }
