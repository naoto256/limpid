[package]
name = "limpidctl"
version = "0.7.15"
edition = "2024"
description = "Control and debug CLI for limpid"
license.workspace = true

[[bin]]
name = "limpidctl"
path = "src/main.rs"

[dependencies]
limpid-metrics-schema = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
base64 = { workspace = true }
pem = { workspace = true }
ring = { workspace = true }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
