[package]
name = "limpid"
version = "0.7.15"
edition = "2024"
description = "Log pipelines, limpid as intent."
license.workspace = true

[dependencies]
limpid-metrics-schema = { workspace = true }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "=1.20.0", features = ["v7", "fast-rng"] }
pest = "2"
pest_derive = "2"
anyhow = "1"
thiserror = "2"
# `release_max_level_info` makes `trace!` / `debug!` macros compile to
# no-ops in release builds, eliminating per-event tracing instrumentation
# from the hot path (mach_absolute_time was 12% of on-CPU on multi-pipeline
# v0.6.0 profiles). Operators relying on `trace!` / `debug!` output need
# a debug build; `info!` / `warn!` / `error!` continue to fire.
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex-lite = "0.1"
csv = "1"
glob = "0.3"
libc = "0.2"
gethostname = "0.5"
async-trait = "0.1"
maxminddb = "0.27"
tokio-rustls = "0.26"
webpki-roots = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
base64 = { workspace = true }
pem = { workspace = true }
ring = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
# Per-event bump arena for the DSL `Value` tree. Each event allocates
# transient `Value::Object` / `Value::Array` / `Value::String` /
# `Value::Bytes` payloads from a thread-local `Bump`; the bump is reset
# at event end, replacing per-allocation `drop_in_place<Value>` chains
# (~23% of allocator samples on v0.5.7 D pipeline) with a single
# pointer reset. See `_PLAN_V060_PERF.md`.
bumpalo = { version = "3", features = ["collections"] }
# Small-string optimisation for the boundary `OwnedValue::String` form.
# Strings up to 24 bytes (the inline budget on 64-bit targets) live in
# the variant itself with no heap allocation; longer strings fall back
# to a heap pointer. The DSL hot path uses arena-backed `&'bump str`
# already, so this targets the heap allocations on the
# `BorrowedEvent::to_owned()` boundary (workspace + outputs queue) where
# typical OCSF / syslog field values (`"INFO"`, `"sshd"`, IPv4
# strings, …) sit comfortably under the inline budget.
compact_str = { version = "0.9", features = ["serde"] }
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"], optional = true }

# OTLP (OpenTelemetry Protocol). Pre-generated message types from the
# official OpenTelemetry-rust ecosystem. `gen-tonic` pulls in tonic +
# generated gRPC client/server stubs; `with-serde` derives Serialize /
# Deserialize so the same message types serialize as both protobuf
# (binary, gRPC and HTTP/protobuf) and JSON (HTTP/JSON).
opentelemetry-proto = { version = "0.32", features = ["logs", "gen-tonic", "with-serde"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
prost = "0.14"
axum = "0.8"
# axum-server with rustls support for the otlp_http TLS / mTLS path.
# axum's bundled `axum::serve` is hardcoded to `TcpListener`; switching
# to axum_server::bind / bind_rustls lets the same Router run on either
# transport without rolling a manual hyper accept loop.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[features]
# No `dep:` gate — the journal reader is a hand-written FFI binding
# inside this crate (src/modules/input/journal_sys.rs), not an
# optional dependency. `build.rs` links libsystemd via pkg-config only
# when this feature is enabled.
journal = []
kafka = ["dep:rdkafka"]

[build-dependencies]
# Locates libsystemd (`libsystemd-dev`) via pkg-config when the
# `journal` feature is enabled. See build.rs.
pkg-config = "0.3"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[package.metadata.deb]
maintainer = "Naoto Morishima"
copyright = "2026, Naoto Morishima"
extended-description = "A log pipeline daemon with a readable DSL. Replaces rsyslogd, syslog-ng, and fluentd."
section = "admin"
priority = "optional"
assets = [
    ["target/release/limpid", "usr/bin/", "755"],
    ["target/release/limpidctl", "usr/bin/", "755"],
    ["../../packaging/limpid.conf.example", "usr/share/limpid/limpid.conf.example", "644"],
    ["../../README.md", "usr/share/doc/limpid/README.md", "644"],
    # The snippet library under packaging/snippets/ is loaded by the
    # daemon via SYSTEM_SNIPPET_DIR (`/usr/share/limpid/snippets/`,
    # see config.rs). Every documented `include "snippets/..."`
    # relies on this directory being present in the deb — without
    # it, an operator following the docs verbatim gets an
    # unresolved-include failure at startup. Ship the whole tree
    # (README + composers/ filters/ functions/ parsers/) so the
    # packaged surface matches what the docs promise.
    ["../../packaging/snippets/README.md", "usr/share/limpid/snippets/README.md", "644"],
    ["../../packaging/snippets/composers/*.limpid", "usr/share/limpid/snippets/composers/", "644"],
    ["../../packaging/snippets/filters/*.limpid", "usr/share/limpid/snippets/filters/", "644"],
    ["../../packaging/snippets/functions/*.limpid", "usr/share/limpid/snippets/functions/", "644"],
    ["../../packaging/snippets/parsers/*.limpid", "usr/share/limpid/snippets/parsers/", "644"],
]
maintainer-scripts = "../../packaging"
# start = false preserves the existing "enable but don't start on first
# install" behaviour: cargo-deb's dh_installsystemd port defaults both
# `enable` and `start` to true when unset (see cargo-deb's
# SystemdUnitsConfig -> dh_installsystemd::Options mapping), which would
# silently start limpid.service as part of `#DEBHELPER#` and conflict
# with rsyslog/syslog-ng still bound to the syslog ports on upgrade.
# enable = true is the default and is listed explicitly for clarity.
systemd-units = { unit-name = "limpid", unit-scripts = "../../packaging", enable = true, start = false }
