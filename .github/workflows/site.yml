name: Site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "docs/src/**"
      - "packaging/snippets/**"
      - "README.md"
      - "crates/*/Cargo.toml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin-audit:2026-06-03 de0fac2 | v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pin-audit:2026-09-06 2499707 | v6.5.0
        with:
          node-version-file: site/.node-version
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npm run check && npm run build && npm run check:links && npm run format:check
        working-directory: site
      - name: Record artifact and source identity
        run: |
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          find site/dist -type f -print0 | sort -z | xargs -0 sha256sum
      - name: Upload verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin-audit:2026-09-06 fc324d3 | v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pin-audit:2026-09-06 cd2ce8f | v5.0.0
