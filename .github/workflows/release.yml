name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pin-audit:2026-06-03 de0fac2 | v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # pin-audit:2026-05-21 29eef33 | stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Install cargo-deb
        # Pinned + --locked so packaging tooling is reproducible; bump the
        # pin deliberately (review the cargo-deb changelog) rather than
        # floating to whatever crates.io serves at release time.
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build release
        run: cargo build --release -p limpid -p limpidctl -p limpid-prometheus --features journal

      - name: Build .deb packages
        run: |
          cargo deb -p limpid --no-build
          cargo deb -p limpid-prometheus --no-build

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Body: everything between this version's heading and the next.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG entry found for ${VERSION}; release body will be empty."
          fi
          # Tagline (optional): a `> ...` blockquote line immediately
          # following the version heading. Used as the second clause of
          # the GitHub Release name (`limpid X.Y.Z — TAGLINE`). Absent →
          # falls back to plain `limpid X.Y.Z`.
          TAGLINE=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { in_section=1; next }
            in_section && /^>/ { sub(/^> ?/, ""); print; exit }
            in_section && /^##/ { exit }
            in_section && /^###/ { exit }
          ' CHANGELOG.md)
          if [ -n "$TAGLINE" ]; then
            NAME="limpid ${VERSION} — ${TAGLINE}"
          else
            NAME="limpid ${VERSION}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        # SHA256SUMS lets consumers verify asset integrity offline
        # (`sha256sum -c SHA256SUMS`). Basenames (not paths) so the
        # check works from the download directory. Cryptographic
        # provenance (attest-build-provenance) is a separate decision:
        # it needs the `id-token: write` permission, so it is left to
        # an explicit owner call rather than bundled here.
        run: |
          cd target/debian
          sha256sum *.deb > SHA256SUMS

      - name: Upload to GitHub Release
        env:
          # Pre-installed gh CLI on the runner authenticates with the
          # job's GITHUB_TOKEN; no third-party action in the trust path.
          GH_TOKEN: ${{ github.token }}
          # Pass the release title through an env var rather than
          # interpolating `${{ ... }}` into `run:` — the value comes
          # from CHANGELOG via awk, so it is repo-controlled rather
          # than attacker-controlled, but expression substitution into
          # a shell command would still be the wrong defense-in-depth
          # shape if a future change ever lets non-repo data flow into
          # `steps.notes.outputs.name`.
          RELEASE_TITLE: ${{ steps.notes.outputs.name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/debian/*.deb target/debian/SHA256SUMS \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
