name: Windows stdout native boundary

on:
  push:
    branches: ['release/*']
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - name: Format native boundary
        run: cargo fmt --manifest-path crates/limpid/tests/native-windows-stdout/Cargo.toml -- --check
      - name: Check native boundary
        run: cargo clippy --locked --manifest-path crates/limpid/tests/native-windows-stdout/Cargo.toml --all-targets -- -D warnings
      - name: Verify bytes, serialization and cancellation
        run: cargo test --locked --manifest-path crates/limpid/tests/native-windows-stdout/Cargo.toml --lib
