name: Windows Kafka native dependency

on:
  push:
    branches: ['release/*']
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kafka:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # OpenSSL's MSVC-generated object paths can exceed MAX_PATH when the
      # standalone harness inherits its deeply nested default target path.
      CARGO_TARGET_DIR: '${{ runner.temp }}/limpid-kafka'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin-audit:2026-06-03 de0fac2 | v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pin-audit:2026-05-20 29eef33 | stable-branch
        with:
          components: clippy, rustfmt
      - name: Verify native build prerequisites
        shell: pwsh
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake is required" }
          $perlPlatform = perl -MIPC::Cmd -e 'print $^O'
          if ($LASTEXITCODE -ne 0 -or $perlPlatform -ne 'MSWin32') {
            throw "Vendored OpenSSL requires native Windows Perl with IPC::Cmd; Git/MSYS Perl is insufficient"
          }
      - name: Format native tests
        run: cargo fmt --manifest-path crates/limpid/tests/native-windows-kafka/Cargo.toml -- --check
      - name: Verify native capabilities and loopback payload
        run: cargo test --locked --manifest-path crates/limpid/tests/native-windows-kafka/Cargo.toml --lib
      - name: Check native tests
        run: cargo clippy --locked --manifest-path crates/limpid/tests/native-windows-kafka/Cargo.toml --all-targets -- -D warnings
